<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b14"/><stop offset="1" stop-color="#1a1033"/></linearGradient>
  <linearGradient id="name" x1="0%" y1="0%" x2="100%" y2="0%" spreadMethod="reflect">
    <stop offset="0" stop-color="#00F5FF"/><stop offset="0.5" stop-color="#A855F7"/><stop offset="1" stop-color="#FF4D8D"/>
    <animate attributeName="x1" values="0%;100%;0%" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="100%;200%;100%" dur="7s" repeatCount="indefinite"/>
  </linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/></pattern>
  <clipPath id="c"><rect width="1000" height="300" rx="24"/></clipPath>
</defs>
<g clip-path="url(#c)">
  <rect width="1000" height="300" fill="url(#bg)"/>
  <rect width="1000" height="300" fill="url(#grid)"/>
  <circle cx="160" cy="70" r="120" fill="#00F5FF" opacity="0.30" filter="url(#blur)">
    <animateTransform attributeName="transform" type="translate" values="0,0;120,50;0,0" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="860" cy="230" r="130" fill="#FF4D8D" opacity="0.28" filter="url(#blur)">
    <animateTransform attributeName="transform" type="translate" values="0,0;-120,-40;0,0" dur="11s" repeatCount="indefinite"/></circle>
  <circle cx="520" cy="150" r="110" fill="#A855F7" opacity="0.30" filter="url(#blur)">
    <animateTransform attributeName="transform" type="translate" values="0,0;-80,40;60,-30;0,0" dur="13s" repeatCount="indefinite"/></circle>

  <g font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="22" font-weight="700" opacity="0.35">
    <text x="70" y="240" fill="#00F5FF">{ }<animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="4s" repeatCount="indefinite"/></text>
    <text x="890" y="80" fill="#FF4D8D">&lt;/&gt;<animateTransform attributeName="transform" type="translate" values="0,0;0,12;0,0" dur="5s" repeatCount="indefinite"/></text>
    <text x="120" y="60" fill="#A855F7">def<animateTransform attributeName="transform" type="translate" values="0,0;0,10;0,0" dur="6s" repeatCount="indefinite"/></text>
    <text x="840" y="250" fill="#00F5FF">()<animateTransform attributeName="transform" type="translate" values="0,0;0,-12;0,0" dur="4.5s" repeatCount="indefinite"/></text>
    <text x="930" y="160" fill="#A855F7">#<animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="5.5s" repeatCount="indefinite"/></text>
    <text x="40" y="150" fill="#FF4D8D">[ ]<animateTransform attributeName="transform" type="translate" values="0,0;0,10;0,0" dur="7s" repeatCount="indefinite"/></text>
  </g>

  <text x="500" y="135" text-anchor="middle" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="74" font-weight="900" letter-spacing="8" fill="url(#name)" opacity="0.55" filter="url(#glow)">KARAN GOBADE</text>
  <text x="500" y="135" text-anchor="middle" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="74" font-weight="900" letter-spacing="8" fill="url(#name)">KARAN GOBADE</text>

  <g font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="24" text-anchor="middle">
    <text x="500" y="190" fill="#e2e8f0">&gt; Python Developer<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.30;0.34;1" dur="9s" repeatCount="indefinite"/></text>
    <text x="500" y="190" fill="#e2e8f0" opacity="0">&gt; Full Stack Developer<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.37;0.63;0.67;1" dur="9s" repeatCount="indefinite"/></text>
    <text x="500" y="190" fill="#e2e8f0" opacity="0">&gt; QA / SDET Enthusiast<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.66;0.70;1" dur="9s" repeatCount="indefinite"/></text>
  </g>

  <rect x="330" y="222" width="340" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
  <circle cx="362" cy="241" r="5" fill="#22C55E"><animate attributeName="r" values="4;7;4" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="380" y="246" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="14" fill="#cbd5e1">Open to work  |  Nagpur, IN  |  Relocate Anywhere</text>

  <path d="M24 60V24H60" fill="none" stroke="#00F5FF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M976 240V276H940" fill="none" stroke="#FF4D8D" stroke-width="2.5" stroke-linecap="round"/>
</g>
<rect x="1" y="1" width="998" height="298" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
</svg>